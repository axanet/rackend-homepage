[tools]
bun = "1.4.3"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the dev server"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Type-check and build the static site into dist/"
depends = ["install"]
run = "bun run build"

[tasks.preview]
description = "Serve the built site locally"
depends = ["build"]
run = "bun run preview"

[tasks.og]
description = "Regenerate public/og.png from the hero scene layout (macOS, uses sips)"
run = "bun scripts/og.ts"

[tasks."docs:screenshots"]
description = "Take the admin UI screenshots for the docs (Docker, Google Chrome, about 6 min): mise run docs:screenshots <image> <out-dir>, e.g. ghcr.io/axanet/rackend:0.0.1 src/assets/screenshots/0.0"
depends = ["install"]
run = "bun scripts/docs-screenshots.ts"

[tasks."docs:release"]
description = "Update the docs after a rackend release: mise run docs:release <x.y.z> (patch: names the release; new minor: archives the latest docs, next becomes latest)"
depends = ["install"]
run = "bun scripts/docs-release.ts"

[tasks."docker:build"]
description = "Build the container image"
run = "docker build -t rackend-homepage:dev ."

[tasks."docker:run"]
description = "Serve the container image on http://localhost:8080"
depends = ["docker:build"]
run = "docker run --rm -p 8080:8080 rackend-homepage:dev"
